# Ostfriesen-Stübchen: holt alle 15 Minuten Pegel Knock + DWD-Wetter Greetsiel
# und legt greetsiel/greetsiel.json ab. GitHub Pages veröffentlicht sie unter
# https://oliverds80.github.io/Club-Plakate/greetsiel/greetsiel.json
# Die Plakate werden davon nicht berührt.
name: Greetsiel-Daten

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # alle 15 Minuten (GitHub startet geplante Läufe oft einige Minuten später)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - greetsiel/holen.py
      - .github/workflows/greetsiel-daten.yml

permissions:
  contents: write

concurrency:
  group: greetsiel-daten
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Daten holen
        env:
          AUSGABE: greetsiel/greetsiel.json
        run: python3 greetsiel/holen.py

      - name: Speichern
        run: |
          git config user.name "greetsiel-daten-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greetsiel/greetsiel.json
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git commit -m "Greetsiel-Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
